StartMessage=Title=<size=24>FALKLANDS CAMPAIGN INFRASTRUCTURE TEST</size>\nBody=Destroy the stationary Soviet missile boat three nautical miles east of your position. This is disposable test infrastructure, not a campaign mission.\nButtonText=Begin test\nPopupStyle=Intro
