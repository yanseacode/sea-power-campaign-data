[Language_en]
Name=Persistence Lab Mission A
Description=Expend ammunition, take damage, optionally lose a unit, and complete the mission for persistence inspection.
Objective_DestroyTarget=Destroy the test target
Objective_Survive=Keep the test vessel afloat
StartMessage=Title=<size=24>PERSISTENCE LAB — MISSION A</size>\nBody=Keep the starred flagship Knox alive. Expose and intentionally lose the second Knox, expend ammunition from a survivor, and allow a survivor to retain observable damage before destroying the hostile torpedo boat.\nButtonText=Begin test\nPopupStyle=Intro
VictoryMessage=Title=<size=24>MISSION A COMPLETE</size>\nBody=The target is destroyed. End the mission, inspect the debrief, and create a named save before opening the no-logistics continuity node.\nButtonText=End test\nPopupStyle=Outro\nMessageRole=Outro
DefeatMessage=Title=<size=24>MISSION A DEFEAT</size>\nBody=The anchor vessel was destroyed. Restart from a fresh laboratory save and preserve the anchor on the next pass.\nButtonText=End test\nPopupStyle=Outro\nMessageRole=Outro
ForcedLossMessage=Title=<size=24>CONTROLLED CASUALTY INJECTED</size>\nBody=The third generated surface unit has been destroyed by the persistence laboratory. Preserve the flagship, expend ammunition, retain survivable damage if practical, and destroy the hostile target.\nButtonText=Continue test\nPopupStyle=NavalMessage

